name: Publish solar visualization
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified visualization bundle
        run: |
          curl -fL --retry 3 -o site.tar https://github.com/Kechuan-ln/urbanphysics-solar-voxel/releases/download/annual-2022-v1/solar-annual-2022.tar
          echo "34ceaf7da6502006660c592972d1f2c8f5e353d2d113358b7ba00b2a0fc1b015  site.tar" | sha256sum -c -
          mkdir site
          tar -xf site.tar -C site
          test -f site/index.html
          mkdir -p site/wind-four-panel
          cp wind-four-panel/index.html site/wind-four-panel/index.html
          mkdir -p site/kowloon-light
          cp kowloon-light/index.html site/kowloon-light/index.html
          mkdir -p site/kowloon-light/canyon
          cp kowloon-light/canyon/index.html site/kowloon-light/canyon/index.html
          mkdir -p site/kowloon-light/1km
          cp -R kowloon-light/1km/. site/kowloon-light/1km/
          test -s site/kowloon-light/1km/demo.json
      - name: Install verified full-resolution sections
        run: |
          curl -fL --retry 3 -o kowloon-sections.tar https://github.com/Kechuan-ln/urbanphysics-solar-voxel/releases/download/kowloon-1km-three-hours-v2/kowloon-sections.tar
          echo "4f8327d1f6f2cb464eddf5778568c93a9c07a6543b73321dc7edfdeb99424137  kowloon-sections.tar" | sha256sum -c -
          mkdir -p site/kowloon-light/1km/data/full
          tar -xf kowloon-sections.tar -C site/kowloon-light/1km/data/full
          test -s site/kowloon-light/1km/data/full/index.json
          test -s site/kowloon-light/1km/demo-full.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
