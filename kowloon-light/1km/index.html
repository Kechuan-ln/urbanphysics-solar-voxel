<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>九龙 · 三维光场演示</title>
<style>
:root {
  color-scheme: dark;
  font: 14px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  background: #101922;
  color: #e7f0f4;
  --muted: #a7b8c3;
  --line: #334753;
  --accent: #84e1d4;
}
* { box-sizing: border-box; }
body { margin: 0; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 24px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 21px; letter-spacing: .02em; }
#summary { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
main { display: grid; grid-template-columns: 292px 1fr; height: calc(100dvh - 66px); }
aside { padding: 18px; overflow: auto; background: #131e27; border-right: 1px solid var(--line); }
section + section { border-top: 1px solid #30414d; margin-top: 16px; padding-top: 13px; }
h2 { font-size: 13px; font-weight: 650; margin: 0 0 8px; }
.row { display: flex; align-items: center; gap: 7px; }
.row > * { min-width: 0; }
.row > input[type=date] { flex: 1; }
.muted { color: var(--muted); font-size: 11px; }
p { margin: 8px 0 0; }
button, select, input { font: inherit; }
button, select, input[type=date] { border: 1px solid #496173; border-radius: 6px; background: #20313e; color: #eef6fa; padding: 6px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { cursor: default; opacity: .45; }
button[aria-pressed=true] { color: #c8fff4; border-color: #68bcb1; background: #254d4c; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { width: 100%; cursor: pointer; }
#time-hour { width: 80px; flex-shrink: 0; }
.step { text-align: center; width: 32px; }
.hour-display { flex: 1; text-align: center; color: #ffe2ac; font-size: 21px; line-height: 1; }
.ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
.view-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
#cut-controls { margin-top: 8px; }
.components { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.angles { margin: 8px 0; }
.angles label, .pair { display: flex; justify-content: space-between; margin-top: 6px; }
input[type=range] { width: 100%; margin: 5px 0; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); vertical-align: middle; }
output { font-variant-numeric: tabular-nums; }
.check-row { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 9px; font-size: 12px; }
.tile-tools { display: flex; gap: 12px; margin-top: 9px; align-items: flex-start; }
#tiles { width: 128px; flex: 0 0 128px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
#tiles button { padding: 0; border-radius: 2px; aspect-ratio: 1; border-color: #406473; background: #223840; }
#tiles button[data-available] { border-color: #6ac4b8; background: #39655f; }
#tiles button:enabled:hover, #tiles button[aria-pressed=true] { background: #7ad3c6; }
#scope-note { margin-top: 8px; }
#viewport { min-width: 0; min-height: 0; position: relative; overflow: hidden; background: #101922; }
#scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.overlay { position: absolute; color: #dce8ed; background: #151f28ed; border: 1px solid #415462; border-radius: 9px; padding: 11px 13px; }
#reading { left: 20px; top: 18px; max-width: min(420px, 60%); }
#reading b { font-size: 15px; }
#reading small { display: block; color: var(--muted); margin-top: 4px; }
#progress { margin: 8px 0 0; width: 100%; accent-color: var(--accent); }
#retry { margin-top: 8px; padding: 3px 8px; font-size: 11px; }
#compass { right: 18px; top: 18px; text-align: center; width: 142px; }
#compass canvas { display: block; width: 114px; height: 74px; margin: 0 auto; }
#compass small { color: #f7ce83; display: block; }
#legend { left: 20px; bottom: 18px; width: min(310px, calc(100% - 40px)); }
#legend strong { font-size: 12px; }
.ramp { height: 7px; border-radius: 7px; background: linear-gradient(90deg, #28547a, #457f9a, #4bc5b8, #f4ce75, #f7834b); margin: 7px 0 3px; }
.legend-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
#shadow-key { margin-top: 7px; color: var(--muted); font-size: 11px; }
#shadow-key i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 10px; }
#shadow-key i:first-child { margin-left: 0; }
#point { right: 18px; bottom: 43px; width: min(350px, calc(100% - 36px)); font-size: 11px; }
#point h2 { margin: 0; }
#point .row { justify-content: space-between; }
#point-reading { color: #d4e4ed; margin-bottom: 8px; }
#direction-lens { width: 100%; height: auto; display: block; margin-top: 8px; cursor: crosshair; }
#lens-component { width: auto; padding: 3px 6px; }
#lens-selection { color: #a8eedf; min-height: 16px; }
#close-point { padding: 1px 7px; font-size: 16px; }
#cut-handle { position: absolute; z-index: 1; transform: translate(-50%, -100%); touch-action: none; cursor: move; color: #c8fff4; font-size: 11px; background: #19312fea; border-color: #68bcb1; padding: 4px 8px; }
#help { right: 18px; bottom: 18px; color: #c6d2d9; text-shadow: 0 1px 5px #000; position: absolute; font-size: 11px; pointer-events: none; }
[hidden] { display: none !important; }
@media (max-width: 800px) {
  header { padding: 10px 13px; }
  h1 { font-size: 16px; }
  #summary { font-size: 10px; text-align: right; }
  main { grid-template-columns: 1fr; grid-template-rows: 58dvh auto; height: auto; }
  aside { grid-row: 2; padding: 14px; }
  #viewport { grid-row: 1; }
  #reading, #legend { left: 8px; }
  #point { right: 8px; bottom: 8px; z-index: 2; }
  #compass { right: 8px; width: 122px; }
  #help { display: none; }
}
</style>
</head>
<body data-demo="demo-full.json">
<header><h1>九龙 · 三维光场演示</h1><div id="summary">正在载入演示</div></header>
<main>
<aside aria-label="光场查询">
  <section>
    <h2>时刻 <span class="muted">香港时间 UTC+8</span></h2>
    <div class="row">
      <input type="date" id="date" aria-label="日期">
      <select id="time-hour" aria-label="小时"></select>
    </div>
    <div class="row" style="margin-top: 9px">
      <button class="step" id="prev" aria-label="上一小时">−</button>
      <output class="hour-display" id="timeline-label" for="timeline">07:00</output>
      <button class="step" id="next" aria-label="下一小时">+</button>
    </div>
    <input id="timeline" aria-label="时间滑块" type="range" min="0" max="23" step="1" value="7">
    <div class="ticks" id="time-ticks" aria-hidden="true"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>
  </section>
  <section>
    <h2>场景视图</h2>
    <div class="view-modes">
      <button id="overview" aria-pressed="true">全区</button>
      <button id="section-mode" aria-pressed="false">街谷剖切</button>
    </div>
    <div id="cut-controls" hidden>
      <label for="cut-axis" class="muted">剖切面走向</label>
      <select id="cut-axis"><option value="1">东西向</option><option value="0">南北向</option></select>
      <label class="pair" for="cut-position">剖切面位置 <output id="cut-value"></output></label>
      <input id="cut-position" type="range" min="0" max="19" value="18" step="1" aria-label="剖切面位置">
    </div>
  </section>
  <section>
    <h2>辐射分量</h2>
    <div class="components" id="components">
      <button data-metric="direct" aria-pressed="true">直射</button>
      <button data-metric="scatter" aria-pressed="false">散射</button>
      <button data-metric="reflection" aria-pressed="false">反射</button>
    </div>
    <p id="metric-note" class="muted"></p>
  </section>
  <section>
    <h2><label for="direction">光的传播方向</label></h2>
    <select id="direction">
      <option value="mean">所有已知方向的平均</option>
      <option value="sun" selected>跟随太阳光传播方向</option>
      <option value="north">向北</option>
      <option value="east">向东</option>
      <option value="south">向南</option>
      <option value="west">向西</option>
      <option value="up">正上方</option>
      <option value="down">正下方</option>
      <option value="custom">自定义方位和俯仰</option>
    </select>
    <div class="angles">
      <label for="az">方位（北 0°，东 90°）<output id="az-value">90°</output></label>
      <input type="range" id="az" min="0" max="359" value="90">
      <label for="alt">俯仰（向下为负）<output id="alt-value">−30°</output></label>
      <input type="range" id="alt" min="-90" max="90" value="-30">
    </div>
    <p id="direction-note" class="muted"></p>
  </section>
  <section>
    <div id="height-controls">
      <h2><label for="height">距地高度</label></h2>
      <select id="height"></select>
    </div>
    <label class="pair" for="opacity">显示浓度 <output id="op-value">60%</output></label>
    <input type="range" id="opacity" min="10" max="100" value="60">
    <div class="check-row">
      <label><input type="checkbox" id="show-mesh" checked> 实景底图</label>
      <label><input type="checkbox" id="show-field"> 光场体素</label>
      <label><input type="checkbox" id="show-unknown" checked> 未知体素</label>
    </div>
  </section>
  <section>
    <h2>空间范围</h2>
    <div class="tile-tools">
      <div id="tiles" aria-label="100 米图块，北朝上"></div>
      <div>
        <p class="muted" id="tile-note">北 ↑<br>点选 100 米图块</p>
      </div>
    </div>
    <p id="scope-note" class="muted"></p>
    <button id="reset" style="margin-top: 8px">重置视角</button>
  </section>
</aside>
<div id="viewport">
  <canvas id="scene" aria-label="九龙实景三维辐射体素"></canvas>
  <div class="overlay" id="reading" role="status"><b id="stamp">正在载入</b><small id="status">载入演示资源</small><progress id="progress" hidden max="1"></progress><button id="retry" type="button" hidden>重读光场</button></div>
  <div class="overlay" id="compass"><canvas id="arrows" width="228" height="148"></canvas><small id="sun-info"></small><span class="muted" id="query-arrow">青色 · 查询方向</span></div>
  <button id="cut-handle" type="button" title="沿剖切面法向拖动，每步 5 米" hidden>拖动切面</button>
  <div class="overlay" id="point" hidden>
    <div class="row"><h2>体素方向图</h2><button id="close-point" aria-label="关闭方向图">×</button></div>
    <p id="point-reading"></p>
    <div class="row">
      <select id="lens-component" aria-label="方向图分量"><option value="scatter">散射</option><option value="reflection">反射</option></select>
      <span class="muted">点方向，查询整个剖面</span>
    </div>
    <canvas id="direction-lens" width="640" height="304" aria-label="128 个传播方向的光强，分向下和向上两个半球"></canvas>
    <div id="lens-selection" aria-live="polite"></div>
    <p class="muted" id="lens-note">外圈为水平 · 金点为直射 · 空心为未知</p>
  </div>
  <div class="overlay" id="legend">
    <strong id="legend-title">实景阴影</strong>
    <div id="shadow-key"><i style="background:#efbc6a"></i>日照<i style="background:#6f93b5"></i>阴影</div>
    <div id="field-key" hidden>
      <div class="ramp" id="field-ramp"></div>
      <div class="legend-scale"><span>0</span><span id="max-value">—</span><span>灰色 · 未知</span></div>
    </div>
    <p class="muted" id="coverage"></p>
  </div>
  <div id="help">拖动旋转 · Shift 拖动平移 · 滚轮缩放 · 点击体素查看方向</div>
</div>
</main>
<script type="module" src="./viewer.js?v=section-v4"></script>
</body>
</html>
